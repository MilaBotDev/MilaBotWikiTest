title: MilaBotWiki
url: ""
baseurl: ""
markdown: kramdown
permalink: pretty
collections:
  wiki:
    output: true
    permalink: /wiki/:path/
  tos_articles:
    output: true
    permalink: /tos/:slug/
  security_articles:
    output: true
    permalink: /security/:slug/
  privacy_articles:
    output: true
    permalink: /privacy/:slug/
defaults:
  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki
      close_url: /wiki/
  - scope:
      path: ""
      type: tos_articles
    values:
      layout: page
      close_url: /tos/
  - scope:
      path: ""
      type: security_articles
    values:
      layout: page
      close_url: /security/
  - scope:
      path: ""
      type: privacy_articles
    values:
      layout: page
      close_url: /privacy/
exclude:
  - WIKI-MAINTENANCE.md
  - ToMakeWiki WillBeDeleted
  - README.md
  - README.txt
  - CON
  - scripts
