# Build and deploy Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate logo image list
        run: node scripts/generate-logo-list.cjs
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure site URL
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let config = fs.readFileSync('_config.yml', 'utf8');
          for (const [key, value] of Object.entries({
            url: process.env.PAGES_ORIGIN,
            baseurl: process.env.PAGES_BASE_PATH
          })) {
            const pattern = new RegExp('^' + key + ':.*$', 'm');
            if (!pattern.test(config)) throw new Error('Missing Jekyll setting: ' + key);
            config = config.replace(pattern, () => key + ': ' + JSON.stringify(value));
          }
          fs.writeFileSync('_config.yml', config);
          NODE
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify rendered policy pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/check-built-pages.cjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
